version: "3.8"

# ==============================================================================
# IT4931 - LƯU TRỮ VÀ XỬ LÝ DỮ LIỆU LỚN (NHÓM 3)
# HỆ THỐNG ĐƯỜNG ỐNG DỮ LIỆU THƯƠNG MẠI ĐIỆN TỬ THỜI GIAN THỰC
# Kiến trúc 5 Tầng Triển khai với Docker Compose (Lambda Architecture)
# ==============================================================================

services:
  # ============================================================================
  # 1. TẦNG THU THẬP (INGESTION LAYER) - Zookeeper, Kafka & Event Generator
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-bigdata-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-service:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-service
    hostname: kafka-service
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 72
    networks:
      - ecommerce-bigdata-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  event-generator-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.generator
    container_name: event-generator-service
    hostname: event-generator-service
    depends_on:
      kafka-service:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-service:9092
      KAFKA_TOPIC: clickstream-events
      EVENTS_PER_SECOND: 25
      LATE_DATA_PROBABILITY: 0.06
      MAX_LATE_MINUTES: 15
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - ecommerce-bigdata-net
    restart: unless-stopped

  # ============================================================================
  # 2. TẦNG LƯU TRỮ PHÂN TÁN (STORAGE LAYER) - HDFS NameNode & DataNode
  # Cấu hình: Block size = 128MB (134217728 bytes), Replication factor = 1
  # ============================================================================
  hdfs-namenode-service:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-namenode-service
    hostname: hdfs-namenode-service
    ports:
      - "9870:9870"
      - "9000:9000"
    env_file:
      - ./hadoop.env
    environment:
      - CLUSTER_NAME=it4931-ecommerce-cluster
    volumes:
      - hdfs_namenode_data:/hadoop/dfs/name
      - ./data:/data
    networks:
      - ecommerce-bigdata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 15s
      timeout: 10s
      retries: 5

  hdfs-datanode-service:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs-datanode-service
    hostname: hdfs-datanode-service
    depends_on:
      hdfs-namenode-service:
        condition: service_healthy
    ports:
      - "9864:9864"
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "hdfs-namenode-service:9870"
    volumes:
      - hdfs_datanode_data:/hadoop/dfs/data
    networks:
      - ecommerce-bigdata-net

  # ============================================================================
  # 3. TẦNG XỬ LÝ (PROCESSING LAYER) - Apache Spark Master & Worker
  # ============================================================================
  spark-master-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-master-service
    hostname: spark-master-service
    depends_on:
      hdfs-namenode-service:
        condition: service_healthy
      postgresql-service:
        condition: service_healthy
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - HDFS_NAMENODE_URI=hdfs://hdfs-namenode-service:9000
      - KAFKA_BOOTSTRAP_SERVERS=kafka-service:9092
      - POSTGRES_HOST=postgresql-service
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ecommerce_serving
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - ecommerce-bigdata-net

  spark-worker-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: spark-worker-service
    hostname: spark-worker-service
    depends_on:
      - spark-master-service
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master-service:7077
      - SPARK_WORKER_MEMORY=4G
      - SPARK_WORKER_CORES=4
      - HDFS_NAMENODE_URI=hdfs://hdfs-namenode-service:9000
      - KAFKA_BOOTSTRAP_SERVERS=kafka-service:9092
      - POSTGRES_HOST=postgresql-service
      - POSTGRES_PORT=5432
      - POSTGRES_DB=ecommerce_serving
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "8081:8081"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - ecommerce-bigdata-net

  # ============================================================================
  # 4. TẦNG PHỤC VỤ (SERVING LAYER) - PostgreSQL Database
  # ============================================================================
  postgresql-service:
    image: postgres:15-alpine
    container_name: postgresql-service
    hostname: postgresql-service
    environment:
      POSTGRES_DB: ecommerce_serving
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_serving_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecommerce-bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_serving"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 5. TẦNG TRỰC QUAN HÓA (VISUALIZATION LAYER) - Streamlit Dashboard
  # ============================================================================
  streamlit-dashboard-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: streamlit-dashboard-service
    hostname: streamlit-dashboard-service
    depends_on:
      postgresql-service:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgresql-service
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce_serving
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8501:8501"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    networks:
      - ecommerce-bigdata-net
    restart: unless-stopped

networks:
  ecommerce-bigdata-net:
    driver: bridge

volumes:
  hdfs_namenode_data:
  hdfs_datanode_data:
  postgres_serving_data:

